[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/content",
  "crates/render",
  "crates/android",
]
default-members = [
  "crates/core",
  "crates/content",
  "crates/render",
  "crates/android",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kouzen-neo/VPetRustMobile"

[workspace.dependencies]
vpet-core = { path = "crates/core" }
vpet-content = { path = "crates/content" }
vpet-render = { path = "crates/render" }
vpet-android = { path = "crates/android" }

anyhow = "1.0"
cosmic-text = "0.19"
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp"] }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.17"
thiserror = "2.0"
tiny-skia = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = { version = "3.5", features = ["json"] }
